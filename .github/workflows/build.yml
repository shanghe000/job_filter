name: Build desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version (v0.1.0); creates a draft on the default branch only
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/smoke_gui.py
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name JobFilter filter_gui.py
      - run: python scripts/check_bundle.py
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: release/*
          retention-days: 14
          if-no-files-found: error
  draft:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || { echo 'Invalid version'; exit 1; }
          gh api "repos/$GH_REPO" >/dev/null
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo 'Version already exists. Refusing to replace it.'
            exit 1
          fi
          args=(--repo "$GH_REPO" --target "$TARGET_SHA" --title "Job Filter $VERSION" --generate-notes --draft)
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" release/* "${args[@]}"
